name: still
description: "A quiet, offline-first gratitude journal. One page a day."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.3
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^3.4.2
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true

  # Newsreader is vendored, never fetched at runtime — the app makes no network
  # calls of any kind. Variable fonts with opsz + wght axes; weights and optical
  # sizing are driven via FontVariation in lib/core/theme/. See assets/fonts/OFL.txt.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
        - asset: assets/fonts/Newsreader-Italic-Variable.ttf
          style: italic
